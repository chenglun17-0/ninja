[package]
name = "ninja-preview"
description = "官方示例插件：文本/代码 pager，独立进程（ADE 协议 v0）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# 红线（PLAN 目标树/技术锁定）：本 crate 是独立进程，只准依赖
# ninja-protocol + 系统框架。永不依赖宿主 crate `ninja`（验收：
# `cargo tree -p ninja-preview` 无宿主 crate）、不链 ghostty-sys、
# 不经任何宿主内部 API——与宿主只交换 ADE socket 上的 JSON 帧。
[[bin]]
name = "ninja-preview"
path = "src/main.rs"

[dependencies]
# ADE 协议（纯 serde 数据类型 + 帧编解码；无宿主代码）。
ninja-protocol.workspace = true

# 层像素：宿主在 layer.ready 里给 IOSurface global id，本进程
# lookup → 建 CGContext 画文本（CoreText）。均为系统框架绑定。
objc2 = "0.6"
objc2-io-surface = "0.3"
objc2-core-foundation = { version = "0.3", features = [
    "CFBase",
    "CFString",
    "CFDictionary",
    "CFAttributedString",
    "CFNumber",
    "CFCGTypes",
] }
objc2-core-graphics = { version = "0.3", features = [
    "CGColorSpace",
    "CGContext",
    "CGColor",
    "CGBitmapContext",
] }
objc2-core-text = { version = "0.3", features = [
    "CTFont",
    "CTLine",
    "CTStringAttributes",
] }
