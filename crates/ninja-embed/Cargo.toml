[package]
name = "ninja-embed"
description = "q0: libghostty 嵌入最小验证——AppKit 窗口挂一个 surface，跑 bash、能输入能渲染，并留能力审计取证"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "ninja-embed"
path = "src/main.rs"

[dependencies]
ghostty-sys = { path = "../ghostty-sys" }
libc = "0.2"

objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSArray",
    "NSDictionary",
    "NSGeometry",
    "NSObject",
    "NSRunLoop",
    "NSTimer",
    "NSDate",
    "NSValue",
    "NSObjCRuntime",
    "NSPathUtilities",
    "NSThread",
] }
objc2-app-kit = { version = "0.3", features = [
    "AppKitDefines",
    "NSApplication",
    "NSWindow",
    "NSView",
    "NSResponder",
    "NSEvent",
    "NSPasteboard",
    "NSColor",
    "NSScreen",
    "NSGraphics",
] }
objc2-quartz-core = { version = "0.3", features = ["CALayer", "CAMetalLayer"] }
# 覆盖层取证：NSColor → CGColor 填 CALayer 背景。
objc2-core-graphics = { version = "0.3", features = ["CGColor"] }
objc2-core-foundation = { version = "0.3", features = [
    "CFBase",
    "CFRunLoop",
    "CFString",
] }
