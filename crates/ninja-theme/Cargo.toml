[package]
name = "ninja-theme"
description = "官方示例插件：连接即推 theme.set 常驻，独立进程（ADE 协议 v0）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# 红线（PLAN 目标树/技术锁定）：独立进程，只准依赖 ninja-protocol。
# 永不依赖宿主 crate `ninja`、不链 ghostty-sys——与宿主只交换
# ADE socket 上的 JSON 帧。
[[bin]]
name = "ninja-theme"
path = "src/main.rs"

[dependencies]
ninja-protocol.workspace = true
