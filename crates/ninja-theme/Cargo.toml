[package]
name = "ninja-theme"
description = "官方示例插件：推完整色板换主题，独立进程（ADE 协议 v0 theme.set）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# 红线（同 ninja-preview，STACK.md / PRODUCT.md）：本 crate 是独立进程，
# 只准依赖 ninja-protocol（纯 serde 数据类型）+ Rust 标准库；永不依赖
# 宿主 crate `ninja`（验收：`cargo tree -p ninja-theme` 无宿主 crate）、
# 不链 libghostty-vt、不经任何宿主内部 API——与宿主只交换 ADE socket
# 上的 JSON 帧。主题插件没有任何像素/框架需求，零系统框架依赖。
[[bin]]
name = "ninja-theme"
path = "src/main.rs"

[dependencies]
ninja-protocol.workspace = true
