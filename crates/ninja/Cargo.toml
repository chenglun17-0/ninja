[package]
name = "ninja"
description = "q1: libghostty 嵌入壳——多窗/原生标签/分屏布局树接 surface，焦点/关闭/resize 全链；q0 取证模式保留可重跑"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "ninja"
path = "src/main.rs"

[dependencies]
ghostty-sys = { path = "../ghostty-sys" }
# q3：ADE 协议（纯数据类型 + 帧编解码）。
ninja-protocol.workspace = true
libc = "0.2"
# q2 配置：ninja.toml 收缩后的解析（[plugins] 等）。
toml = "0.9"

objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSArray",
    "NSDictionary",
    "NSGeometry",
    "NSObject",
    "NSRunLoop",
    "NSTimer",
    "NSDate",
    "NSValue",
    "NSObjCRuntime",
    "NSPathUtilities",
    "NSThread",
    # q1 壳：IME（NSTextInputClient 回调参数）/ zoom dump 之外的文本对象。
    "NSRange",
    "NSAttributedString",
] }
objc2-app-kit = { version = "0.3", features = [
    "AppKitDefines",
    "NSApplication",
    "NSWindow",
    "NSView",
    "NSResponder",
    "NSEvent",
    "NSPasteboard",
    "NSColor",
    "NSAppearance",
    "NSScreen",
    "NSGraphics",
    # q1 壳：菜单 / NSTextInputClient（IME）/ 追踪区。
    "NSMenu",
    "NSMenuItem",
    "NSTextInputClient",
    "NSTrackingArea",
    # q3 插件面板：开关与状态行。
    "NSButton",
    "NSControl",
    "NSTextField",
] }
objc2-quartz-core = { version = "0.3", features = ["CALayer", "CAMetalLayer"] }
# q3 层原语：全局 IOSurface（跨进程共享像素）。
objc2-io-surface = "0.3"
# 覆盖层取证：NSColor → CGColor 填 CALayer 背景。
objc2-core-graphics = { version = "0.3", features = [
    "CGColor",
    "CGColorSpace",
    # q3 层原语：present 时 IOSurface 像素拷贝成 CGImage，LayerView 的
    # drawRect 里画进 layer-backed 内容。
    "CGDataProvider",
    "CGImage",
    "CGContext",
] }
objc2-core-foundation = { version = "0.3", features = [
    "CFBase",
    "CFRunLoop",
    "CFString",
    # q3 层原语：IOSurface 属性字典 + present 像素拷贝（CFData）。
    "CFDictionary",
    "CFNumber",
    "CFData",
] }
