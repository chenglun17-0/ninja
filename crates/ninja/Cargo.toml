[package]
name = "ninja"
description = "q1: libghostty 嵌入壳——多窗/原生标签/分屏布局树接 surface，焦点/关闭/resize 全链；q0 取证模式保留可重跑"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "ninja"
path = "src/main.rs"

[dependencies]
ghostty-sys = { path = "../ghostty-sys" }
libc = "0.2"

objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSArray",
    "NSDictionary",
    "NSGeometry",
    "NSObject",
    "NSRunLoop",
    "NSTimer",
    "NSDate",
    "NSValue",
    "NSObjCRuntime",
    "NSPathUtilities",
    "NSThread",
    # q1 壳：IME（NSTextInputClient 回调参数）/ zoom dump 之外的文本对象。
    "NSRange",
    "NSAttributedString",
] }
objc2-app-kit = { version = "0.3", features = [
    "AppKitDefines",
    "NSApplication",
    "NSWindow",
    "NSView",
    "NSResponder",
    "NSEvent",
    "NSPasteboard",
    "NSColor",
    "NSScreen",
    "NSGraphics",
    # q1 壳：菜单 / NSTextInputClient（IME）/ 追踪区。
    "NSMenu",
    "NSMenuItem",
    "NSTextInputClient",
    "NSTrackingArea",
] }
objc2-quartz-core = { version = "0.3", features = ["CALayer", "CAMetalLayer"] }
# 覆盖层取证：NSColor → CGColor 填 CALayer 背景。
objc2-core-graphics = { version = "0.3", features = ["CGColor"] }
objc2-core-foundation = { version = "0.3", features = [
    "CFBase",
    "CFRunLoop",
    "CFString",
] }
