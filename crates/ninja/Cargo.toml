[package]
name = "ninja"
description = "ninja 宿主：p0 钉版骨架 + p1 单终端面（AppKit + Metal + PTY + vt）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "ninja"
path = "src/main.rs"

[dependencies]
# 默认 features = vendored 静态链 libghostty-vt.a + kitty-graphics。
# 宿主依赖树禁 wasmtime / 任何 JS 运行时（验收用 cargo tree 取证）。
libghostty-vt.workspace = true
libc = "0.2"

# p2 配置：~/.config/ninja/ninja.toml（shell/字体/键位/主题色）。
# 只在启动时解析一次，不进空载常驻路径。
toml = "0.9"
serde = { workspace = true }

# p3 ADE 协议：纯 serde 数据类型 + JSON 编解码（无运行时、无线程、
# 无 socket 逻辑——socket 在宿主自己的 plugins.rs）。宿主依赖它只为
# 同源类型；协议本身仍只经 Unix socket 交换字节。
ninja-protocol.workspace = true

# p1 终端面：AppKit 壳 + 自研 Metal cell atlas + CoreText 字形。
# 只用 objc2 家族（同一 runtime），不引 winit/egui/GPUI，不碰 Ghostty 内部 API。
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSArray",
    "NSAttributedString",
    "NSDictionary",
    "NSGeometry",
    "NSRange",
    "NSObject",
    "NSRunLoop",
    "NSTimer",
    "NSDate",
    "NSValue",
    "NSObjCRuntime",
    "NSURL",
    "block2",
] }
objc2-app-kit = { version = "0.3", features = [
    "AppKitDefines",
    "NSApplication",
    "NSWindow",
    "NSView",
    "NSResponder",
    "NSEvent",
    "NSPasteboard",
    "NSMenu",
    "NSMenuItem",
    "NSTextInputClient",
    "NSCursor",
    "NSGraphics",
    "NSColor",
    "NSWorkspace",
] }
objc2-quartz-core = { version = "0.3", features = [
    "CALayer",
    "CAMetalLayer",
] }
objc2-metal = { version = "0.3", features = [
    "MTLDevice",
    "MTLCommandQueue",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLBlitCommandEncoder",
    "MTLRenderCommandEncoder",
    "MTLRenderPipeline",
    "MTLRenderPass",
    "MTLVertexDescriptor",
    "MTLTexture",
    "MTLBuffer",
    "MTLLibrary",
    "MTLDrawable",
    "MTLPixelFormat",
    "MTLResource",
    "MTLSampler",
    "MTLDefines",
    # p5 层：newTextureWithDescriptor:iosurface:plane: 需要
    # MTLAllocation + objc2-io-surface 特性（宿主把插件层包成纹理）。
    "MTLAllocation",
    "objc2-io-surface",
] }
# p5 层原语：宿主建 IOSurface（跨进程共享像素），global id 经
# layer.ready 告知插件（默认 features 含 IOSurfaceRef/Types/libc）。
objc2-io-surface = "0.3"
objc2-core-text = { version = "0.3", features = [
    "CTFont",
    "CTFontDescriptor",
    "CTFontTraits",
    "CTLine",
    "CTStringAttributes",
] }
objc2-core-graphics = { version = "0.3", features = [
    "CGContext",
    "CGBitmapContext",
    "CGColor",
    "CGColorSpace",
    "CGImage",
    "CGAffineTransform",
] }
objc2-core-foundation = { version = "0.3", features = [
    "CFBase",
    "CFRunLoop",
    "CFDate",
    "CFString",
    "CFDictionary",
    "CFAttributedString",
    "CFCGTypes",
] }
block2 = "0.6"
