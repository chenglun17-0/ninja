[workspace]
resolver = "2"
members = [
    "crates/ghostty-sys",
    # 产品宿主（AppKit 壳 + libghostty 嵌入 + ADE 插件系统）。
    "crates/ninja",
    # ADE 协议 v0（纯数据类型 + 帧编解码）。官方示例插件在独立仓库
    # ninja-plugins（本仓库不分发任何插件）。
    "crates/ninja-protocol",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ninja-protocol = { path = "crates/ninja-protocol" }
