[workspace]
resolver = "2"
members = [
    "crates/ninja",
    "crates/ninja-protocol",
    "crates/ninja-preview",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
# 钉 libghostty-vt 0.2.1（sys 层钉 ghostty commit a887df42c56f6de86c0fe6da9c4eeca37931e083，
# 默认 vendored 静态链 libghostty-vt.a + kitty-graphics）。
# 只允许走 include/ghostty/ 公开 C API；顶层内部 include/ghostty.h 禁止（STACK.md）。
libghostty-vt = "0.2.1"
