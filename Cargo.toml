[workspace]
resolver = "2"
members = [
    "crates/ninja-protocol",
    "crates/ninja-preview",
    "crates/ninja-theme",
    "crates/ghostty-sys",
    "crates/ninja-embed",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
# ADE 协议：宿主与示例插件共用纯数据类型；协议仍只经 socket 交换字节。
ninja-protocol = { path = "crates/ninja-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
